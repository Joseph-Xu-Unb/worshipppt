services:
  - type: web
    name: worshipppt
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_TENANT_ID
        sync: false
      - key: ONEDRIVE_REFRESH_TOKEN
        sync: false
      - key: ONEDRIVE_TOKEN_ISSUED_AT
        sync: false
